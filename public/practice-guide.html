<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice flock · guided walkthrough</title><style>body{margin:0;background:#f3f5f1;color:#24372e;font:16px/1.6 system-ui}header{padding:20px 5%;background:#244e3b;color:white}header a{color:#fff}main{max-width:1000px;margin:24px auto;padding:0 20px}nav{display:flex;gap:10px;flex-wrap:wrap}button,select{padding:12px;border:1px solid #b9c8bf;border-radius:7px;background:white;color:#244e3b;cursor:pointer;font:inherit}article{background:white;padding:26px;border:1px solid #d2dcd5;border-radius:12px;margin:18px 0}h1{font-size:25px;margin:0}h2{margin-top:4px}.where{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#627669}li{padding:7px 0}.expected{background:#e9f1eb;padding:18px;border-left:4px solid #427a57}.warning{background:#fff2c7;padding:12px;border-radius:6px}.sample{overflow:auto}table{border-collapse:collapse;font-size:13px}td,th{border:1px solid #d5dfd8;padding:8px}footer{display:flex;justify-content:space-between;gap:10px;margin-bottom:30px}progress{width:100%;accent-color:#396b4c}@media print{nav,footer,header a,button,select,progress{display:none}article{break-inside:avoid}main{max-width:none}}</style><header><h1>Your practice flock walkthrough</h1><p>One feature at a time · Fictional data · <a href="http://127.0.0.1:5174/" target="_blank">Open practice program ↗</a></p></header><main><p class="warning">Use the amber PRACTICE COPY tab at 127.0.0.1:5174. Your live HTTPS farm records are separate. The practice server must be running on this computer.</p><nav><select id="jump" aria-label="Choose a stage"></select><button id="print">Print all steps</button><button id="copy">Copy animal cells</button><a href="practice-assets/sample-import.csv" download>Sample import CSV</a> · <a href="practice-assets/sample-image.png" download>Sample image</a></nav><p id="count"></p><progress id="progress"></progress><div id="stage"></div><footer><button id="back">← Previous</button><label><input id="done" type="checkbox"> Stage checked</label><button id="next">Next →</button></footer></main><script>const steps=[{"title": "Start in the practice copy", "where": "Practice copy \u00b7 Sheep \u00b7 2025", "actions": ["Open http://127.0.0.1:5174/. Confirm the amber PRACTICE COPY banner. Keep this tab separate from the live farm tab.", "Choose Sheep. Open the historical year 2025 using the year controls.", "Open Animals. The practice list should be empty. Do not restore your real backup here."], "expect": "0 practice animals. Your live farm still contains its existing records."}, {"title": "Add four animals in the worksheet", "where": "Animals \u2192 Add animals", "actions": ["Add rows until there are four. Enter the table below, or use Copy animal cells and paste into Name in row 1.", "Columns: Name, Sex, Birth date, Birth year, Breed, Origin, Right tag, Right color, Left tag, Left color, EID, Registry, Registration number, Breeder/farm, Notes.", "Use Tab to move across cells and Enter to move down. Leave optional cells blank.", "Review animals, then Save 4 animals. Refresh the practice page to check persistence."], "expect": "Four active animals: Oak and Maple (ewes), Cedar and Birch (rams). Leading zeros remain in tags. Empty left tags/colors are not flagged."}, {"title": "Correct identity and test tags", "where": "Animals \u2192 Oak profile", "actions": ["Correct Oak\u2019s name to Oak Test, save with reason Typo test, then correct it back to Oak. Review change history.", "Correct right tag 001 to 0001 using the typo-correction action.", "Record a lost/replaced tag dated 2025-02-01: retire 0001 and replace with 0101, blue.", "Add two additional visual tags in the left ear: L01 yellow and L02 white. Choose exactly which two tags to swap, then swap back.", "Add an EID 900000000000001, linking it to a physical tag only if that is what you intend."], "expect": "Typos and replacements are distinct. The lost tag remains in history. Extra left-ear tags retain their own number and color. Swapping one pair does not change other tags."}, {"title": "Photos, registry and ownership", "where": "Oak profile; Settings \u2192 Contacts", "actions": ["Use the sample-image.png file as a practice photo. Upload it, then another image and change the current photo; check past photos remain.", "Enter fictional registry TRAIN, registration T-001, breeder Practice Farm. Attach a sample image to the registration area.", "Create a contact called Practice Farm in Settings.", "Record ownership effective 2025-01-01: Practice Farm 100%. Then record a new 50/50 ownership entry with Training Partner on 2025-03-01."], "expect": "Photo history and registration paperwork are easy to locate. Ownership shares total 100%; prior names and shares remain dated."}, {"title": "Custom fields and batch edits", "where": "Settings \u2192 Custom fields; Animals \u2192 Batch edit", "actions": ["Create a Text field Training pen and a Yes/No field Training checked.", "Set Oak\u2019s values to A1 and Yes; save and reopen.", "Batch-edit Oak and Maple: add breeder/farm Practice Farm and note Training foundation ewe. Review and save.", "Export animal CSV from Reports and verify custom values and animal identifiers are present."], "expect": "Batch corrections retain history. Custom fields preserve their data types. No tag retirement occurs because only descriptive fields changed."}, {"title": "Unowned ancestors and relationships", "where": "Pedigree", "actions": ["Add unowned sire Orion, male, birth year 2022. Add unowned dam Luna, female, birth year 2022.", "Set Orion as sire of both Oak and Maple; set Luna as Oak\u2019s dam. Leave Maple\u2019s dam unknown.", "Add another ancestor above Orion to exercise a third generation.", "Review the maternal and paternal branches. Try to make Oak its own ancestor; cancel or expect rejection."], "expect": "Owned active count stays four. Oak and Maple share a sire. Unknown ancestry remains unknown; the program must not claim unrelatedness from missing data. Cycles are rejected."}, {"title": "COI: prove a known result and test the limit", "where": "Animals / Pedigree / Breeding \u00b7 2025", "actions": ["Add a disposable practice ram Ash: Male, born 2024-01-15, Purchased. Set sire Orion and dam Luna, exactly the same two parents as Oak.", "Open a new Planned breeding group, choose Ash, and find Oak. Oak and Ash are full siblings. With their recorded parents unrelated and non-inbred, the projected offspring COI must be 25.00%.", "Confirm Oak cannot be selected for a planned mating above 20%, or the save is rejected. Do not save an actual exposure as a workaround.", "Close the unsaved group. In Ash\u2019s pedigree, clear dam Luna with reason Half-sibling COI test. Ash and Oak now share only sire Orion.", "Reopen the planned group and check projected COI 12.50%. Close without saving.", "Compare Cedar and Birch for selected ewes. A displayed known-pedigree 0% with missing ancestors does not prove the animals are unrelated.", "Delete disposable Ash from Animals so the active core flock returns to four. Retain its history for review."], "expect": "Full-sibling mating 25.00%; half-sibling mating 12.50% under the stated founder assumptions. Application rules: over 20% blocks planned mating; exactly 20% is a strong warning; 15% or more warns. These are configured application rules, not a universal breeding recommendation."}, {"title": "Plan and expose a breeding group", "where": "Breeding \u00b7 2025", "actions": ["Create group Autumn Practice with Cedar and ewes Oak and Maple. Set Planned and leave its date blank; save.", "Reopen and set planned start 2025-10-01. Save.", "Record actual exposure start 2025-10-05 and end 2025-11-01. Preserve the planned date.", "Review individual ewe exposure periods and pregnancy-check entry. Enter a definite positive check only as fictional training data.", "Create and delete a second empty planned group called Delete Me."], "expect": "Planned and actual dates remain separate. One ram can appear in multiple groups in a year. Deleting the test group does not delete animals."}, {"title": "Composite planning without changing the flock", "where": "Breeding \u2192 project settings", "actions": ["Create a practice composite project with Dorper, Romanov, Katahdin and St. Croix at 25% each.", "Review ewe relationships and candidate rams for the project.", "Enter complete breed composition only for animals whose practice composition you choose to define. Leave unknown parents unknown.", "Inspect what changes when switching the project on/off. Do not turn planned output into an actual animal record."], "expect": "Targets total 100%. Related females can be considered together without permanent family-group membership. Missing composition is not silently assigned percentages."}, {"title": "Record Oak\u2019s litter", "where": "Lambing \u00b7 2026", "actions": ["Switch to 2026 and open Record birth / litter.", "Birth date 2026-03-01; dam Oak; confirmed sire Cedar; related exposure Autumn Practice.", "Row 1: Willow, Female, Alive, right tag 101, blue, birth weight 8 lb.", "Row 2: Poppy, Female, Stillborn, no tags, no weight; cause Training example \u2014 unknown cause.", "Review litter and save."], "expect": "One litter, one born-alive profile, one stillborn entry. Active count is five. Poppy stays in litter history and does not become an active animal."}, {"title": "Record Maple\u2019s litter and correct notes", "where": "Lambing \u00b7 2026", "actions": ["Record 2026-03-01; dam Maple, sire Cedar, exposure Autumn Practice.", "One offspring: Juniper, Male, Alive, right tag 102, yellow, birth weight 9 lb.", "Save. Reopen Correct litter and update assistance/notes with reason Training correction.", "Use a separate disposable litter if you want to test void/restore before later dependent records exist; restore it or void it again before continuing."], "expect": "Two core litters, two born-alive offspring, one stillborn. Six active core animals. Original litter details remain in history after correction."}, {"title": "Rearing and weaning", "where": "Animal events \u00b7 2026", "actions": ["Record a rearing change for Willow dated 2026-03-02: Fostered, foster dam Maple, number reared together 2.", "Record Weaning dated 2026-05-01 for Willow and Juniper. Leave optional weights blank here because the next step tests the weight worksheet."], "expect": "Biological dam of Willow remains Oak. Foster/rearing information is separate. Both offspring have dated weaning events."}, {"title": "Batch weights and correction", "where": "Weights & growth \u00b7 2026", "actions": ["Choose Born in selected year and Enter batch weights. Session Spring weaning, date 2026-05-01, default unit lb.", "Find Willow and Juniper. Enter 40 and 45 lb in their rows; paste the two values into Measured weight if those rows are adjacent.", "Review and save the batch. Try the same animal/date again; expect a duplicate-date warning rather than another measurement.", "Correct Willow\u2019s 40 to 41 with a reason, check history, then correct back to 40.", "Switch to All ages / breeding stock and enter an adult measurement in a separate session if desired."], "expect": "Birth and measured weights remain actual records. Willow gains 32 lb over 61 days; Juniper gains 36 lb over 61 days. Adult weighing remains available."}, {"title": "Growth, peer comparisons and source calculations", "where": "Weights & growth; Reports", "actions": ["Compare Willow and Juniper using the same birth-year/date window. Review included/excluded animals and export CSV.", "Open the adjusted-weight calculator. Enter only an explicit factor/source you are testing; save a calculation snapshot.", "Review the saved snapshot and confirm actual weights still read 8/40 for Willow and 9/45 for Juniper.", "Try a growth/finishing budget with explicit inputs; vary target weight or feed price and inspect the result."], "expect": "Calculated/adjusted values do not replace measured weights. Unknown costs stay unknown. These test values are not breeding advice or clinical guidance."}, {"title": "Membership, ration and feed bill", "where": "Groups & watch list; Feed & rations; Finances", "actions": ["Create management group Spring Pen: Willow present 2026-05-01 through 2026-05-10. Add Juniper\u2019s separate membership 2026-05-06 through 2026-05-10.", "Record ration Practice Hay dated 2026-05-01: ingredient hay, 100 lb, price $400 per US ton, daily amount 2 lb/head.", "In Finances record one Feed expense dated 2026-05-10 for $8.00, title Spring Pen feed. Initially leave animals blank.", "In Feed & rations expand Allocate a feed bill to animals. Select the bill, Spring Pen, May 1\u201310, Practice Hay, 2 lb/head/day. Preview.", "Expect Willow 10 days/20 lb and Juniper 5 days/10 lb; shares $5.33 and $2.67.", "Set Juniper\u2019s override to 4 lb/head/day. Preview again: both have 20 lb and receive $4 each. Save this allocation."], "expect": "The expense remains $8 total, not $16. Animal financials get $4 each. Saved allocation retains membership/ration inputs. Blank or unknown ration prices are not treated as free feed."}, {"title": "Management flag lifecycle", "where": "Groups & watch list \u2192 Add management flag", "actions": ["Flag Oak on 2026-05-01. Category Heat management; title Observe next cycle; follow-up 2026-05-05.", "Open Dashboard and find the flag. Use Review / resolve to open it.", "Set resolution date 2026-05-06 and save. Reopen its history."], "expect": "The open flag disappears from the current watch list after resolution but remains in dated history. This does not change animal status or create an expense."}, {"title": "Health inventory and multi-day treatment", "where": "Health & inventory", "actions": ["Create a fictional stock lot: TRAINING ONLY \u2014 not a medicine, dated 2026-05-01, opening quantity 100 mL, low threshold 98, expiration 2026-06-01.", "For warning testing only, enter review interval 7 days, maximum dose 2, source Fictional software test values \u2014 not veterinary instructions.", "Create a treatment protocol for Willow and Juniper dated 2026-05-02. Use this fictional lot; add May 2 and May 3 doses, 1 mL per animal, state Given.", "Review warnings and save. Check each dose in history and remaining inventory.", "Test a Scheduled dose or individual Skipped state, then review inventory again. Do not use this scenario to select real treatments or doses."], "expect": "Two doses \u00d7 two animals \u00d7 1 mL = 4 mL used, 96 remaining. Low stock appears in Health and Dashboard. Expired stock also appears as of dates after June 1. Scheduled/skipped doses do not consume stock."}, {"title": "Lab records and attachments", "where": "Health & inventory; Genetic evaluations", "actions": ["Enter a fictional lab/test result for Willow dated 2026-05-04, with value, unit and reference text.", "Attach a sample image/document and inspect the record history.", "In Genetic evaluations enter a fictional source/provider, trait and value; use the evaluation CSV workflow with its documented column mapping if desired."], "expect": "The source and reported value are retained without inventing a medical interpretation or an EBV. Provider-specific import layouts beyond supported mappings may require later enhancement."}, {"title": "Veterinary expenses and purchase basis", "where": "Finances \u00b7 2026", "actions": ["Record an Animal purchase expense of $400 dated 2026-01-01, assigned equally to Oak, Maple, Cedar and Birch.", "Record Veterinary expense $30 dated 2026-05-04, assigned only to Willow.", "Record general Veterinary expense $50 on the same date with no animals selected.", "Inspect Willow\u2019s annual/lifetime expenses and a foundation animal\u2019s purchase basis."], "expect": "Core cash expenses total $488: purchase 400 + individual vet 30 + general vet 50 + feed 8. Willow has $34 assigned; Juniper $4. General $50 stays at flock level. Purchase basis is not counted twice."}, {"title": "Retain, value, sell and exit history", "where": "Finances; Animal profiles", "actions": ["Record Retain decision for Willow dated 2026-06-01. Add a retained-value estimate of $200; this is not income.", "Record income/sale $150 dated 2026-06-15 for Juniper. Include its Sold exit and a fictional buyer.", "In Birch\u2019s profile record Dead effective 2026-07-01.", "Inspect Active, Sold and Dead counts, historical dates and the cull-reason field. If testing a cull, use a disposable animal rather than changing this core scenario."], "expect": "Core active count is four; Juniper is Sold and Birch Dead. Core recorded income $150, expenses $488, cash net \u2212$338. Willow\u2019s estimated $200 is separate. Unknown exit dates must remain explicit if you test them."}, {"title": "Reports, filters, dashboard and calendar", "where": "Reports; Calendar; Dashboard", "actions": ["Run whole-species cash reports for 2026. Check the core totals from the previous step.", "Filter to Willow and use Matching animals and their assigned amounts: expenses should be $34, excluding the general $50.", "Review parent performance, breeding cohorts and birth/early-life outcomes. The core litters have two born alive and one stillborn, with no dated early deaths.", "Save a report setup, change it, archive and restore it. Export the available CSVs and print.", "Customize dashboard cards, inspect calendar month/agenda, and open a follow-up back in its original record year."], "expect": "Cash and estimates remain separate. Animal filters do not silently narrow full breeding/litter cohort reports. Parents\u2019 contributions are not summed into farm profit."}, {"title": "Imports and search without duplicates", "where": "Animals \u2192 Import animals; Search records", "actions": ["Download the import template. Import sample-import.csv supplied with this guide as two additional disposable practice animals.", "Review field mapping, optional missing sex/date values, colors and pedigree columns before saving.", "Search current tags, retired tags, names, EIDs, notes and dates. Review ambiguous matches rather than choosing automatically.", "Delete the two imported practice animals and restore one, then delete it again to return to the core scenario."], "expect": "Imports preview before saving; missing sex/birth details are flagged, blank tags/colors are not. Deleted records remain recoverable. Core counts exclude these disposable deleted animals."}, {"title": "Species and historical workspaces", "where": "Species/year controls", "actions": ["Switch to Goats and confirm Sheep records are not listed. Add one disposable practice goat in 2026 and then delete it.", "Switch Sheep to 2025 and review the foundation animals and original breeding group. Switch back to 2026 for births.", "Try All Years: review data, but expect entry to be disabled."], "expect": "Species records remain separate. Sheep and Goats remember their own selected years. All Years is read-only."}, {"title": "Offline and conflict handling", "where": "Practice copy only \u00b7 Pending saves", "actions": ["First let Offline reload ready appear. Use the browser\u2019s developer tools to set this practice tab offline; do not disconnect your entire computer.", "Create a dated note for Oak. Expect a device-pending message, not a server-saved claim.", "Return the tab online. Open Pending saves, select the note, and Sync selected saves. Reopen the animal to verify it.", "For conflict testing use a second practice tab: edit the same note online, then attempt to sync an older offline edit. Review current/pending fields deliberately."], "expect": "Nothing syncs automatically. Conflicts retain pending copies. Uploads, recovery and feed allocation require an online connection. If browser offline controls are unfamiliar, ask me to demonstrate this stage."}, {"title": "Back up and rehearse recovery", "where": "Backups & recovery \u00b7 Practice copy only", "actions": ["Download a full practice backup. Also create a retained manual vault copy.", "After that backup, add a disposable animal called After Backup.", "Choose full rollback, load the practice backup, preview differences, confirm it is the PRACTICE tab, and enter RESTORE only after reviewing the affected records.", "Confirm After Backup is removed, the safety copy is available, and stale open tabs require reload.", "Test species-only recovery with disposable Goat data if desired. Do not load the real farm backup into this practice walkthrough."], "expect": "Recovery previews before applying, keeps a safety archive, and does not reuse retired animal numbers. Manual backups work; unattended scheduling remains unavailable."}, {"title": "Record findings and return to your farm", "where": "Testing checkpoint", "actions": ["For each issue record: step number, animal/record, values entered, what you expected, and what happened. Include a screenshot if useful.", "Mark each completed stage in this guide; progress stays in this browser.", "Keep the practice window separate. When done, return to the original HTTPS farm address. Your real farm records have not been cleared.", "Deferred sorting/batch refinements and wider provider formats are enhancement items. Automatic backup scheduling is a known infrastructure gap, not a passing test."], "expect": "You have exercised the main connected workflows. A passed walkthrough does not prove every edge case; unresolved findings become the next fix list."}, {"title": "Coverage audit: all 37 requirement areas", "where": "Use this checklist after the walkthrough", "actions": ["1 Overall concept: practice isolation, species/year workspaces, navigation and dashboard.", "2 Identity: permanent IDs, leading-zero tags, typo correction, retirement, replacements, swaps and EID.", "3 Animal information: worksheet, optional data, batch edits and flags.", "4 Ownership/registry: contacts, shares, registrations and dedicated paperwork.", "5 Status/year: sale/death history, active counts, historical views, deleted versus exited animals.", "6 Lifetime profile: photos, past photos, documents, weights, events and financial history.", "7 Pedigree/genetics: both parent lines, multiple generations, unowned ancestors and sourced evaluations.", "8 Breeding: planned/actual dates, multiple groups per ram, individual periods, pregnancy checks and archive/restore.", "9 COI: full-sibling 25%, half-sibling 12.5%, planned-mating limit, candidate comparisons and incomplete-pedigree caveat.", "10 Cross-year breeding: 2025 exposure remains in 2025 while 2026 births link back to it.", "11 Flushing: configure explicit timing in the project and inspect calendar dates; nutritional prescription is not supplied.", "12 Lambing/kidding: offspring worksheets, birth profiles/weights, safe corrections, void/restore and historical links.", "13 Outcomes: born alive versus stillborn, later death dates, unknown dates and outcome reports.", "14 Rearing/weaning: biological versus foster dam, number reared and dated weaning.", "15 Management groups: dated membership, join/leave periods, reentry and feed allocation.", "16 Weights: lamb/adult sessions, imports, actual versus adjusted weights, corrections, voids and peer ADG.", "17 Parent performance: offspring counts, weaning, retained decisions and separate parent contributions.", "18 Health: individual/group protocols, lab values, attachments, follow-ups and dose states.", "19 Inventory: stock balance, low/expired warnings, duplicate/repeat/amount reviews and optional tracking.", "20 Feed: priced ration versions, group periods, individual quantities/rations, exact bill allocation and source snapshots.", "21 Finances: individual/general bills, annual/lifetime figures, actual cash and purchase basis; no depreciation.", "22 Contribution: retained estimates separate from actual cash and parental comparisons.", "23 Sales: sale proceeds and linked exits; corrections must not double-count cash or reverse an exit silently.", "24 Sessions: select, enter, review, save, retry, correct, void and restore with history.", "25 EID imports: identifier matching, retired identifiers and ambiguous matches; real device-export compatibility needs your representative files.", "26 Imports: CSV/Excel/PDF preview, templates, pedigree mapping and missing-value behavior; arbitrary document layouts are not guaranteed.", "27 Search: names, tags, former identifiers and dated farm records across species/years.", "28 Reports: filters, saved setups, charts, CSV, print, parent/cohort and birth outcomes.", "29 Dashboard: card choices, watch list, stock alerts and links back to source records.", "30 Calendar: month/agenda, original record year, follow-ups, exposure/birth windows and project timing.", "31 Phone: check narrow layout and install affordance; advanced chute/device workflows remain refinements.", "32 Offline: cached records, explicit pending saves, manual sync, conflicts and no false server-save claim.", "33 Recovery: records/full exports, checksums, manual vault, safety copies, scope preview, rollback and stale-copy guards. Unattended weekly/monthly scheduling is BLOCKED, not passed.", "34 Portability: backup/source exports exist; migrating to another host requires configuration work, not just a checkbox.", "35 Custom fields: typed values, history, archive behavior and CSV; broader custom-field batch/import support remains deferred.", "36 Settings: species/year preferences, contact directory, custom fields and project targets/timing.", "37 Exclusions: do not test for depreciation, forced composition, native app/PIN, mandatory Bluetooth, pasture mapping or full dry-matter/NRC model parity."], "expect": "Mark an area passed only after its observed behavior matches the scenario. Record untested, failed, deferred and blocked separately. This checklist covers every requirement area; it does not claim every possible edge case is complete."}],animalCells="Oak\tFemale\t2024-01-10\t\tSt. Croix\tPurchased\t001\tWhite\t\t\t\t\t\tPractice Farm\tTraining ewe\nMaple\tFemale\t2024-01-12\t\tRomanov\tPurchased\t002\tYellow\t\t\t\t\t\tPractice Farm\tTraining ewe\nCedar\tMale\t2024-01-05\t\tKatahdin\tPurchased\t003\tBlue\t\t\t\t\t\tPractice Farm\tTraining ram\nBirch\tMale\t2024-01-08\t\tDorper\tPurchased\t004\tGreen\t\t\t\t\t\tPractice Farm\tTraining ram";let current=0,done=[];try{current=Number(localStorage.getItem('flock-training-stage')||0);done=JSON.parse(localStorage.getItem('flock-training-done')||'[]')}catch{}if(!Number.isInteger(current)||current<0||current>=steps.length)current=0;const $=id=>document.getElementById(id),esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');function body(s,i){return `<article><p class="where">Stage ${i+1} of ${steps.length} · ${esc(s.where)}</p><h2>${esc(s.title)}</h2><ol>${s.actions.map(a=>'<li>'+esc(a)+'</li>').join('')}</ol>${i===1?'<div class="sample"><table><tr><th>Name</th><th>Sex</th><th>DOB</th><th>Breed</th><th>Right tag</th><th>Color</th></tr>'+animalCells.split('\n').map(r=>{const c=r.split('\t');return '<tr>'+[0,1,2,4,6,7].map(j=>'<td>'+esc(c[j])+'</td>').join('')+'</tr>'}).join('')+'</table></div>':''}<div class="expected"><strong>Expected result</strong><br>${esc(s.expect)}</div></article>`}function render(){ $('stage').innerHTML=body(steps[current],current);$('jump').value=current;$('done').checked=done.includes(current);$('back').disabled=current===0;$('next').disabled=current===steps.length-1;$('count').textContent=done.length+' of '+steps.length+' stages checked';$('progress').max=steps.length;$('progress').value=done.length;try{localStorage.setItem('flock-training-stage',current);localStorage.setItem('flock-training-done',JSON.stringify(done))}catch{}}steps.forEach((s,i)=>$('jump').add(new Option((i+1)+'. '+s.title,i)));$('jump').onchange=e=>{current=Number(e.target.value);render()};$('back').onclick=()=>{current--;render();scrollTo(0,0)};$('next').onclick=()=>{current++;render();scrollTo(0,0)};$('done').onchange=e=>{done=e.target.checked?[...new Set([...done,current])]:done.filter(n=>n!==current);render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(animalCells);$('copy').textContent='Copied — paste into Name, row 1'}catch{prompt('Copy these tab-separated cells:',animalCells)}};$('print').onclick=()=>{$('stage').innerHTML=steps.map(body).join('');window.print();render()};render();</script></html>
